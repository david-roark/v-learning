name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      target:
        description: Android target architecture
        type: choice
        options:
          - aarch64
          - all
        default: aarch64
        required: true
      debug:
        description: Build debug APK (faster, unsigned-ready for testing)
        type: boolean
        default: true
      publish_release:
        description: Publish APK to a GitHub Release
        type: boolean
        default: true
      tag:
        description: Release tag name (e.g. android-v0.1.0 or v0.1.0)
        type: string
        default: android-v0.1.0
        required: true

permissions:
  contents: write

jobs:
  android:
    name: Build Android (${{ inputs.target }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Configure Android SDK & NDK env
        run: |
          ndk_dir="${ANDROID_NDK_HOME:-}"
          if [ -z "$ndk_dir" ] || [ ! -d "$ndk_dir" ]; then
            ndk_dir="$(ls -d "${ANDROID_HOME}/ndk/"* | sort -V | tail -n 1)"
          fi
          echo "NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi
          rm -rf src-tauri/gen/android/app/src/main/res/mipmap-*
          cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      - name: Build Android APK
        run: |
          args=(--apk)
          if [ "${{ inputs.debug }}" = "true" ]; then
            args+=(--debug)
          fi
          if [ "${{ inputs.target }}" != "all" ]; then
            args+=(--target "${{ inputs.target }}")
          fi
          npx tauri android build "${args[@]}"

      - name: Collect APK files
        run: |
          mkdir -p dist-apk
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} dist-apk/ \;
          ls -lh dist-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: v-learning-android-${{ inputs.target }}
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist-apk/*.apk --clobber
          else
            gh release create "$tag" dist-apk/*.apk \
              --title "V-Learning Android (${tag})" \
              --notes "Android APK build (${{ inputs.target }})."
          fi
