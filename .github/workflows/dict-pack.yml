name: Build Dictionary Pack

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Dictionary profile to build
        type: choice
        options:
          - modern
          - full
        default: modern
        required: true
      version:
        description: Pack version tag (e.g. v1.0.0)
        type: string
        default: v1.0.0
        required: true
      with_kaikki_en:
        description: Download & ingest Kaikki English (~2GB)
        type: boolean
        default: false
      publish_release:
        description: Publish built .db.zst and manifest.json to a GitHub Release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-pack:
    name: Build Dict Pack (${{ inputs.profile }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/dict-builder/requirements.txt

      - name: Install dict-builder dependencies
        run: pip install -r scripts/dict-builder/requirements.txt

      - name: Build dictionary pack
        run: |
          args=(--profile "${{ inputs.profile }}" --version "${{ inputs.version }}")
          if [ "${{ inputs.with_kaikki_en }}" = "true" ]; then
            args+=(--with-kaikki-en)
          fi
          python3 scripts/dict-builder/build_dict.py "${args[@]}"

      - name: Upload pack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dict-${{ inputs.profile }}-${{ inputs.version }}
          path: |
            scripts/dict-builder/dist/*.db.zst
            scripts/dict-builder/dist/*.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dict-${{ inputs.profile }}-${{ inputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" scripts/dict-builder/dist/*.db.zst scripts/dict-builder/dist/*.manifest.json --clobber
          else
            gh release create "$tag" \
              scripts/dict-builder/dist/*.db.zst \
              scripts/dict-builder/dist/*.manifest.json \
              --title "Dictionary Pack (${{ inputs.profile }} ${{ inputs.version }})" \
              --notes "Offline FTS5 dictionary pack built with profile \`${{ inputs.profile }}\`."
          fi
