name: Build Dictionary Pack

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Dictionary profile(s) to build
        type: choice
        options:
          - all
          - modern
          - full
        default: all
        required: true
      version:
        description: Pack version tag (e.g. v1.0.0)
        type: string
        default: v1.0.0
        required: true
      with_kaikki_en:
        description: Download & ingest Kaikki English (~2GB)
        type: boolean
        default: false
      publish_release:
        description: Publish built .db.zst and manifest.json to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.set-matrix.outputs.profiles }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.profile }}" = "all" ]; then
            echo 'profiles=["modern","full"]' >> "$GITHUB_OUTPUT"
          else
            echo 'profiles=["${{ inputs.profile }}"]' >> "$GITHUB_OUTPUT"
          fi

  build-pack:
    name: Build Dict Pack (${{ matrix.profile }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.prepare.outputs.profiles) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/dict-builder/requirements.txt

      - name: Install dict-builder dependencies
        run: pip install -r scripts/dict-builder/requirements.txt

      - name: Build dictionary pack
        run: |
          args=(--profile "${{ matrix.profile }}" --version "${{ inputs.version }}")
          if [ "${{ matrix.profile }}" = "full" ]; then
            args+=(--with-gcide)
          fi
          if [ "${{ inputs.with_kaikki_en }}" = "true" ]; then
            args+=(--with-kaikki-en)
          fi
          python3 scripts/dict-builder/build_dict.py "${args[@]}"

      - name: Upload pack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dict-${{ matrix.profile }}-${{ inputs.version }}
          path: |
            scripts/dict-builder/dist/*.db.zst
            scripts/dict-builder/dist/*.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dict-${{ matrix.profile }}-${{ inputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" scripts/dict-builder/dist/*.db.zst scripts/dict-builder/dist/*.manifest.json --clobber
          else
            gh release create "$tag" \
              scripts/dict-builder/dist/*.db.zst \
              scripts/dict-builder/dist/*.manifest.json \
              --title "Dictionary Pack (${{ matrix.profile }} ${{ inputs.version }})" \
              --notes "Offline FTS5 dictionary pack built with profile \`${{ matrix.profile }}\`."
          fi
